const Palette=p=><Ic {...p}><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2a10 10 0 0 0 0 20c.9 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7H16a6 6 0 0 0 6-6c0-4.9-4.5-8.4-10-8.4Z"/></Ic>;
const Shield=p=><Ic {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></Ic>;
const Globe=p=><Ic {...p}><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></Ic>;
const Power=p=><Ic {...p}><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></Ic>;
const Timer=p=><Ic {...p}><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></Ic>;
const Mail=p=><Ic {...p}><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></Ic>;
const Fb=p=><Ic {...p}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></Ic>;

const Insta=p=><Ic {...p}><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></Ic>;
const AtSign=p=><Ic {...p}><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></Ic>;
const Chat=p=><Ic {...p}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></Ic>;

const Pin=p=><Ic {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></Ic>;
const Megaphone=p=><Ic {...p}><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></Ic>;
const Eye=p=><Ic {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></Ic>;
const Pointer=p=><Ic {...p}><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></Ic>;
const Users=p=><Ic {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></Ic>;
const Send=p=><Ic {...p}><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></Ic>;
const Flame=p=><Ic {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3.3.4 1.6 1.4 2.8 2.5 2.8z"/></Ic>;
const Tag=p=><Ic {...p}><path d="M12 2H2v10l9.3 9.3a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><path d="M7 7h.01"/></Ic>;
const Trash=p=><Ic {...p}><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></Ic>;
const Star=p=><Ic {...p}><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></Ic>;
const PlusC=p=><Ic {...p}><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></Ic>;
const Cal=p=><Ic {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></Ic>;
const Flag=p=><Ic {...p}><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"/></Ic>;
const Chevron=p=><Ic {...p}><path d="m6 9 6 6 6-6"/></Ic>;
const Menu=p=><Ic {...p}><path d="M4 6h16M4 12h16M4 18h16"/></Ic>;

/* ===== Dữ liệu mẫu ===== */
const fmt=n=>Math.round(Number(n||0)).toLocaleString('vi-VN');
const gio=()=>new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const BUOC=[
  {k:'tim',ten:'Quét xu hướng & từ khóa',chi:'Google Trends · Search Console · tin FDI',I:Search,log:'🔄 Đang quét từ khóa xu hướng và tin doanh nghiệp, FDI…',xong:'✅ Chọn chủ đề: '},
  {k:'viet',ten:'AI viết bài SEO & mạng xã hội',chi:'Website · Facebook · LinkedIn · Threads · Zalo',I:Bot,log:'🤖 AI đang viết bài SEO và nội dung từng kênh…',xong:'✅ Viết xong bài: '},
  {k:'ve',ten:'Thiết kế banner',chi:'1080×1350 · 1200×628 · logo Oni',I:Palette,log:'🎨 Đang thiết kế banner cho từng kênh…',xong:'✅ Banner đạt chuẩn, đủ logo'},
  {k:'kiem',ten:'Kiểm lỗi chữ & hình',chi:'Từ cấm · giá · hashtag · dấu tiếng Việt',I:Shield,log:'🧐 Đang kiểm lỗi chữ, giãn dòng, từ cấm…',xong:'✅ Kiểm lỗi: Đạt'},
  {k:'dang',ten:'Đăng bài tự động',chi:'WordPress · Fanpage · Zalo OA · Threads',I:Globe,log:'🌐 Đang đăng bài lên các kênh theo lịch mỗi giờ…',xong:'✅ Đã đăng lên các kênh'},
  {k:'so',ten:'Thu số liệu',chi:'Lượt xem · lượt bấm · khách để lại thông tin',I:BarChart,log:'📊 Đang thu số liệu bài vừa đăng…',xong:'✅ Cập nhật số liệu xong'},
];
const CHU_DE_TU_DONG=['Thuê văn phòng ảo quận 1 cho công ty mới','Địa chỉ đăng ký kinh doanh tại Gò Vấp','Thủ tục thành lập công ty vốn nước ngoài 2026','Phòng họp theo giờ ở Tân Định','Văn phòng trọn gói cho startup','Đổi địa chỉ trụ sở công ty: hồ sơ cần có'];
const daDung=new Set();
const KENH={
  content:[
    {id:'web',ten:'Website',I:Globe,mau:'text-sky-300 bg-sky-500/10'},
    {id:'email',ten:'Email newsletter',I:Mail,mau:'text-amber-300 bg-amber-500/10'},
    {id:'fanpage',ten:'Fanpage Facebook',I:Flag,mau:'text-blue-300 bg-blue-500/10'},
    {id:'fbcn',ten:'Facebook cá nhân',I:User,mau:'text-indigo-300 bg-indigo-500/10'},
    {id:'li',ten:'LinkedIn',I:Linkedin,mau:'text-cyan-300 bg-cyan-500/10'},
    {id:'ig',ten:'Instagram',I:Insta,mau:'text-pink-300 bg-pink-500/10'},
    {id:'th',ten:'Threads',I:AtSign,mau:'text-zinc-200 bg-zinc-500/15'},
    {id:'zl',ten:'Zalo OA',I:Chat,mau:'text-blue-300 bg-blue-600/10'},
    {id:'tt',ten:'TikTok',I:Music,mau:'text-rose-300 bg-rose-500/10'},
    {id:'gb',ten:'Google Business',I:Pin,mau:'text-emerald-300 bg-emerald-500/10'},
  ],
  paid:[
    {id:'gads',ten:'Google Ads',I:Search,mau:'text-yellow-300 bg-yellow-500/10'},
    {id:'fads',ten:'Facebook Ads',I:Megaphone,mau:'text-violet-300 bg-violet-500/10'},
    {id:'zads',ten:'Zalo OA Ads',I:Chat,mau:'text-blue-300 bg-blue-500/10'},
  ]};
const TAT_CA=[...KENH.content,...KENH.paid];
const SO_GOC={zads:[9800,240,11],web:[5200,410,18],email:[1340,212,9],fanpage:[20478,890,14],fbcn:[3120,160,4],li:[860,54,3],ig:[2410,96,2],th:[1880,73,1],zl:[960,118,7],tt:[0,0,0],gb:[4310,265,21],gads:[12800,620,26],fads:[35400,1130,31]};
const DOI_TUONG=['Doanh nghiệp SME tại TP.HCM','Nhà đầu tư FDI (Hàn, Nhật, Trung, Singapore)','Startup & freelancer 22–35 tuổi','Bán kính 5 km quanh CS1 Tân Định / CS2 Gò Vấp','Kế toán, dịch vụ thành lập công ty'];
const NEN=['from-[#1C2B4A] to-[#0F1A30]','from-[#3B2A1A] to-[#1E140C]','from-[#123A2A] to-[#0A2018]','from-[#2A1C3B] to-[#160E22]'];


/* Chiến dịch quảng cáo mẫu: ngân sách/ngày, đã chi hôm nay, tổng đã chi, hiển thị, bấm, khách */
const NEN_ADS={fads:'Facebook Ads',gads:'Google Ads',zads:'Zalo Ads'};
const mk=(id,ten,nen,ns,ngay,daChay,tt,dt)=>{const l7=Array.from({length:7},(_,i)=>tt==='Tạm dừng'&&i>4?0:Math.round(ns*(.7+Math.random()*.3)));const chi=l7.slice(0,Math.min(7,daChay)).reduce((a,b)=>a+b,0)+Math.max(0,daChay-7)*ns*.85;
  return {id,ten,nen,ns,ngay,daChay,tt,dt,l7,chi,chiHom:tt==='Đang chạy'?Math.round(ns*.42):0,hien:Math.round(chi/1000*36),click:Math.round(chi/1000*36*.019),lead:Math.round(chi/1000*36*.019*.06)}};
const CD_MAU=[
  mk(1,'Văn phòng ảo quận 1 – tin nhắn','Facebook Ads',200000,30,12,'Đang chạy','Doanh nghiệp SME tại TP.HCM'),
  mk(2,'Phòng họp theo giờ Tân Định','Facebook Ads',150000,14,9,'Đang chạy','Bán kính 5 km quanh CS1 Tân Định / CS2 Gò Vấp'),
  mk(3,'Ưu đãi văn phòng trọn gói CS2','Facebook Ads',100000,7,7,'Tạm dừng','Startup & freelancer 22–35 tuổi'),
  mk(4,'Thành lập công ty vốn nước ngoài','Google Ads',300000,30,18,'Đang chạy','Nhà đầu tư FDI (Hàn, Nhật, Trung, Singapore)'),
  mk(5,'Thuê văn phòng ảo – từ khóa','Google Ads',250000,30,21,'Đang chạy','Doanh nghiệp SME tại TP.HCM'),
  mk(6,'Quan tâm Zalo OA Oni Office','Zalo Ads',120000,14,6,'Đang chạy','Doanh nghiệp SME tại TP.HCM'),
];
function DemSo({v,suffix=''}){const [h,setH]=useState(v);const t=useRef(v);useEffect(()=>{let f;const s=t.current,t0=performance.now();const run=x=>{const p=Math.min(1,(x-t0)/650);const val=s+(v-s)*p;t.current=val;setH(val);if(p<1)f=requestAnimationFrame(run)};f=requestAnimationFrame(run);return()=>cancelAnimationFrame(f)},[v]);return <>{fmt(h)}{suffix}</>}
const The=({children,className=''})=><div className={`rounded-2xl bg-zinc-900/80 border border-zinc-800 ${className}`}>{children}</div>;


/* Ô giao việc nhanh – có ở đầu Bảng điều khiển Auto */
function GiaoNhanh({S}){const {setViec,themLog}=S;const [nd,setNd]=useState('');
  const giao=()=>{if(!nd.trim())return;setViec(a=>[{id:Date.now(),nd:nd.trim(),loai:'Chủ đề nóng',kenh:['web','fanpage','li','th','zl'],uu:'Cao',tt:'Chờ vòng tới',luc:gio()},...a]);themLog('👑 Boss giao chủ đề: "'+nd.trim()+'" – bot viết ở vòng tới','text-amber-300 font-semibold');setNd('')};
  return (<div className="rounded-xl border border-amber-400/40 bg-amber-400/5 p-3">
    <div className="text-sm font-bold text-amber-200 flex items-center gap-2 mb-2"><Crown className="w-4 h-4"/>Boss giao chủ đề cho vòng tới</div>
    <div className="flex gap-2 flex-col sm:flex-row"><input value={nd} onChange={e=>setNd(e.target.value)} onKeyDown={e=>e.key==='Enter'&&giao()} placeholder="VD: Ưu đãi phòng họp cuối năm cho doanh nghiệp FDI" className="flex-1 min-w-0 rounded-lg bg-zinc-950 border border-zinc-700 focus:border-amber-400 outline-none px-3 py-2.5"/>
    <button onClick={giao} disabled={!nd.trim()} className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg font-extrabold bg-gradient-to-r from-amber-300 to-amber-500 text-zinc-900 disabled:opacity-40"><Send className="w-4 h-4"/>Giao việc</button></div>
    <div className="text-[11.5px] text-zinc-400 mt-1.5">Bot chỉ làm chủ đề chị giao. Làm xong thì vòng lặp tự dừng, chờ chị giao tiếp.</div></div>)}
/* ===== TAB 1: AUTO DASHBOARD ===== */
function TabAuto({S}){const {chay,pt,vong,buocNay,ptBuoc,log,dongHo,toc,setToc,viecDangLam,tk}=S;
  const logRef=useRef(null);useEffect(()=>{if(logRef.current)logRef.current.scrollTop=0},[log]);
  return (<div className="space-y-5 in">
    <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">
      {[[Globe,'Bài Website đã đăng',tk.web],[Send,'Bài mạng xã hội',tk.mxh],[Refresh,'Vòng lặp đã chạy',vong-1],[Users,'Khách để lại thông tin',tk.lead]].map(([I,t,v],i)=>(
        <The key={i} className="p-4"><div className="flex items-center justify-between text-xs text-zinc-400"><span>{t}</span><span className="p-2 rounded-lg bg-emerald-500/10 text-emerald-300"><I className="w-4 h-4"/></span></div><div className="mt-2 text-2xl md:text-3xl font-extrabold text-white"><DemSo v={v}/></div></The>))}
    </div>
    <The className="p-5 space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h2 className="font-bold text-lg flex items-center gap-2"><Refresh className={`w-5 h-5 text-emerald-400 ${chay?'animate-spin [animation-duration:3s]':''}`}/>Nhà máy nội dung tự động <span className="text-xs text-zinc-500 font-normal">· vòng #{vong}</span></h2>
        <div className="flex items-center gap-2 text-sm">
          <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-black/40 border border-zinc-700 mono text-emerald-300"><Timer className="w-4 h-4"/>{!chay?'Tạm dừng':(!S.coChuDe&&pt===0)?'Chờ chị giao việc':'Vòng tới sau '+dongHo}</span>
          <select value={toc} onChange={e=>setToc(+e.target.value)} className="bg-zinc-950 border border-zinc-700 rounded-lg px-2 py-1.5 text-xs"><option value={1}>Tốc độ 1×</option><option value={2}>2×</option><option value={4}>4×</option></select>
        </div>
      </div>
      <GiaoNhanh S={S}/>
      {viecDangLam&&<div className="in flex items-center gap-2 text-sm rounded-xl px-3 py-2 bg-amber-500/10 border border-amber-400/30 text-amber-200"><Crown className="w-4 h-4"/>Vòng này đang viết việc Boss giao: <b className="truncate">{viecDangLam.nd}</b></div>}
      {!S.coChuDe&&pt===0&&<div className="in flex items-center gap-2 text-sm rounded-xl px-3 py-2 bg-red-500/10 border border-red-400/30 text-red-200"><Timer className="w-4 h-4"/>Đã làm xong việc chị giao – vòng lặp dừng, chờ chị giao chủ đề mới ở ô phía trên. Mỗi chủ đề chỉ viết 1 lần.</div>}
      <div>
        <div className="flex justify-between text-xs text-zinc-400 mb-1"><span>Tiến độ vòng #{vong}</span><span className="mono text-white">{Math.floor(pt)}%</span></div>
        <div className="h-3 rounded-full bg-zinc-800 overflow-hidden relative"><div className="h-full rounded-full bg-gradient-to-r from-emerald-400 via-cyan-400 to-violet-400" style={{width:pt+'%'}}></div>{chay&&<div className="absolute inset-0 shimmer"></div>}</div>
      </div>
      <div className="grid md:grid-cols-2 gap-2.5">
        {BUOC.map((b,i)=>{const xong=i<buocNay,dang=i===buocNay,I=b.I;
          return (<div key={b.k} className={`rounded-xl border p-3 transition-all duration-300 ${dang?'border-emerald-400/50 bg-emerald-500/5 scale-[1.01]':xong?'border-zinc-700 bg-zinc-800/40':'border-zinc-800 bg-zinc-950/40 opacity-60'}`}>

    {toast&&(<div className="fixed bottom-5 right-5 left-5 sm:left-auto sm:w-[440px] z-50 in"><div className={`rounded-2xl p-4 shadow-2xl border flex gap-3 items-start backdrop-blur ${toast.loi?'bg-red-950/95 border-red-500/50':'bg-emerald-950/95 border-emerald-400/50'}`}>
      <span className={`w-9 h-9 rounded-full grid place-items-center shrink-0 ${toast.loi?'bg-red-500/20 text-red-300':'bg-emerald-500/20 text-emerald-300'}`}>{toast.loi?<X className="w-5 h-5"/>:<Check className="w-5 h-5"/>}</span>
      <div className="text-sm flex-1"><b className={toast.loi?'text-red-200':'text-emerald-200'}>{toast.loi?'Chưa gửi được':'Thành công'}</b><div className="text-zinc-200 mt-0.5">{toast.m}</div></div>
      <button onClick={()=>setToast(null)} className="text-zinc-400 hover:text-white"><X className="w-4 h-4"/></button></div></div>)}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
