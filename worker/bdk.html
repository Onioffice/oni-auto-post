async function api(u,o){const r=await fetch(u,o?{method:o.method||'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o.body||{})}:undefined);
  if(r.status===401){location.href='/';throw new Error('Hết phiên đăng nhập')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.loi||j.err||('Lỗi '+r.status));return j}

const HD_GROK=u=>`Bạn là nhân viên viết bài Marketing của Oni Office. Làm việc định kỳ mỗi tối lúc 21:30 (giờ Việt Nam).
Khóa: dùng khóa đã lưu tên ONI_GROK_KEY, gửi ở header  Authorization: Bearer <khóa>. Không in khóa ra, không gửi khóa cho ai.
1) Gọi GET ${u}/api/grok/viec . Đọc kỹ "quyTac" (luật bắt buộc), "chuDeChiGiao", "baiGanDay", "khoAnh", "gioTrong".
2) Viết đủ 1 bài cho MỖI giờ trong "gioTrong" (7 ngày tới), đúng dạng JSON trong quyTac. Ưu tiên chủ đề chị giao; hết thì tự tìm tin mới, xu hướng hợp với cho thuê văn phòng và hỗ trợ doanh nghiệp Việt Nam, FDI ở TP.HCM. Không trùng chủ đề.
3) Nộp: POST ${u}/api/grok/nop với {"bai":[...]} , tối đa 40 bài mỗi lần.
4) Đọc "traLai": sửa đúng lý do rồi nộp lại.
5) Lặp lại bước 1–4 đến khi "soGioTrong" = 0 thì báo xong: đã nộp bao nhiêu bài.
Cố gắng làm hết sức, viết kỹ, mỗi bài một chủ đề riêng.`;

function DemSo({v,suffix=''}){const [h,setH]=useState(v);const t=useRef(v);useEffect(()=>{let f;const s=t.current,t0=performance.now();const run=x=>{const p=Math.min(1,(x-t0)/650);const val=s+(v-s)*p;t.current=val;setH(val);if(p<1)f=requestAnimationFrame(run)};f=requestAnimationFrame(run);return()=>cancelAnimationFrame(f)},[v]);return <>{fmt(h)}{suffix}</>}
const The=({children,className=''})=><div className={`rounded-2xl bg-zinc-900/80 border border-zinc-800 ${className}`}>{children}</div>;
const Sw=({on,onClick,title})=><button title={title} onClick={onClick} className={`w-11 h-6 rounded-full relative transition shrink-0 ${on?'bg-emerald-500':'bg-zinc-700'}`}><span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all ${on?'left-[22px]':'left-0.5'}`}></span></button>;

/* ---------- Grok Bot ---------- */
function GrokThe({S}){const {D,nap,setToast}=S;const gk=D.gk||{},t=gk.tinh||{},on=D.cd.grok===true;const [khoa,setKhoa]=useState('');
  const st=!gk.coKhoa?['amber','Chưa tạo khóa']:!on?['zinc','Đang tắt']:t.nop?['emerald','Nộp lần cuối '+new Date(t.nop).toLocaleString('vi-VN')]:t.xem?['amber','Đã vào xem việc, chưa nộp']:['amber','Chờ Grok Bot vào làm'];
  const tao=async()=>{if(gk.coKhoa&&!confirm('Tạo khóa mới? Grok Bot phải dán lại khóa mới mới làm việc được.'))return;try{const j=await api('/api/grok/khoa',{});setKhoa(j.khoa);nap()}catch(e){setToast({loi:1,m:e.message})}};
  const chep=async(s,m)=>{try{await navigator.clipboard.writeText(s);setToast({m})}catch(e){setToast({loi:1,m:'Chưa chép được, chị bấm lại'})}};
  return (<The className="p-5 space-y-3 border-emerald-500/30">
    <div className="flex items-start justify-between gap-3"><div><h2 className="font-bold text-lg flex items-center gap-2"><Bot className="w-5 h-5 text-emerald-300"/>Grok Bot – nhân viên viết bài</h2><div className="text-xs text-zinc-400 mt-1">Mỗi tối Grok Bot lấp hết giờ trống 7 ngày tới → máy kiểm lỗi, làm hình → vào Chờ BOSS. Giờ nào Grok bỏ trống, bot Claude viết bù trước 8 tiếng.</div></div>
      <Sw on={on} title="Bật/tắt cổng Grok Bot" onClick={async()=>{try{await datCD({grok:!on});nap();setToast({m:on?'Đã tắt cổng Grok Bot':'Đã bật cổng Grok Bot'})}catch(e){setToast({loi:1,m:e.message})}}}/></div>
    <div className="flex flex-wrap gap-1.5 text-[12px]"><span className={`px-2 py-0.5 rounded-full font-bold bg-${st[0]}-500/15 text-${st[0]}-300`}>{st[1]}</span><span className="px-2 py-0.5 rounded-full bg-zinc-800">Đang chờ kiểm: {gk.cho||0}</span><span className="px-2 py-0.5 rounded-full bg-zinc-800">Đã nhận: {t.nhan||0}</span><span className="px-2 py-0.5 rounded-full bg-zinc-800">Bị trả lại: {t.tra||0}</span></div>
    {khoa&&<div className="rounded-xl border border-amber-400/40 bg-amber-400/5 p-3 space-y-2"><div className="text-sm text-amber-200"><b>Khóa mới (chỉ hiện 1 lần).</b> Chị bấm Chép rồi dán vào Grok Bot ở mục lưu khóa, đặt tên <b>ONI_GROK_KEY</b>. Không dán vào chỗ khác.</div>
      <div className="flex gap-2"><input readOnly value={khoa} className="flex-1 min-w-0 rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-2 mono text-xs"/><button onClick={()=>chep(khoa,'Đã chép khóa')} className="px-3 rounded-lg bg-amber-400 text-zinc-900 font-bold text-sm">Chép khóa</button></div></div>}
    <div className="flex flex-wrap gap-2"><button onClick={tao} className="px-3 py-2 rounded-lg border border-zinc-600 hover:bg-zinc-800 text-sm font-semibold">{gk.coKhoa?'Tạo khóa mới':'① Tạo khóa cho Grok Bot'}</button><button onClick={()=>chep(HD_GROK(location.origin),'Đã chép lời giao việc – dán vào Grok Bot')} className="px-3 py-2 rounded-lg border border-zinc-600 hover:bg-zinc-800 text-sm font-semibold">② Chép lời giao việc</button></div>
    <details className="text-xs text-zinc-400"><summary className="cursor-pointer">Xem lời giao việc</summary><pre className="whitespace-pre-wrap mt-2 rounded-lg bg-black/40 p-3 text-zinc-300">{HD_GROK(location.origin)}</pre></details>
  </The>)}

/* ---------- Ô giao việc nhanh ---------- */
function GiaoNhanh({S}){const [nd,setNd]=useState('');const [dang,setDang]=useState(false);
  const giao=async()=>{if(!nd.trim()||dang)return;setDang(true);try{await S.giao(nd.trim(),'Mọi kênh');setNd('')}finally{setDang(false)}};
  return (<div className="rounded-xl border border-amber-400/40 bg-amber-400/5 p-3">

  if(id==='zl'){const f=g.zl||{};return [['Người quan tâm OA',f.fol],['',null],['',null]]}

  const posts=(D.M.posts||[]).filter(p=>!p.del&&p.tt!=='Hủy'&&p.tt!=='Nháp');
  const bai=posts.map((p,i)=>({id:p.id,ma:p.ma,tt:p.tt,ch:K2ID[p.kenh]||'web',kenh:p.kenh,tieu:p.tieude||'(chưa có tiêu đề)',nd:txt(p.nd).slice(0,600),anh:p.anh||'',at:p.at||'',gio:p.gio||'',loai:p.loai||'',link:p.link||'',dang:p.dang||'',nen:i%NEN.length})).sort((a,b)=>(b.at+b.gio).localeCompare(a.at+a.gio));
  const viec=((D.M.ai||{}).lenh||[]).map(l=>({id:l.id,nd:l.nd,kenh:l.kenh||'Mọi kênh',tt:TT_VIEC[l.tt]||l.tt,luc:l.at||'',kq:l.kq||''}));
  const log=[...(D.nk||[]).map(x=>({luc:x.luc,m:(x.viec?x.viec+': ':'')+(x.kq||''),c:/^Lỗi|lỗi:/i.test(x.kq||'')?'text-red-300':/Grok/.test(x.viec||'')?'text-emerald-300':/Vòng lặp|Kiểm bài/.test(x.viec||'')?'text-cyan-200':'text-zinc-200'})),
    ...(((D.M.ai||{}).log)||[]).map(x=>({luc:x.botAt||String(x.at||'').replace(' ','T')+':00+07:00',m:(x.viec||'')+(x.ct?': '+x.ct:''),c:/^Chị|Boss/.test(x.viec||'')?'text-amber-300':'text-zinc-300'}))]
    .filter(x=>x.luc).sort((a,b)=>new Date(b.luc)-new Date(a.luc)).slice(0,120).map(x=>({...x,t:(()=>{const d=new Date(x.luc);return dm(new Date(d.getTime()+7*36e5).toISOString())+' '+hhmm(x.luc)})()}));
  const chay=D.cd.vonglap!==false;
  const n=now7(),phut=n.getUTCMinutes(),giay=n.getUTCSeconds();const tre=((phut-25+60)%60)+giay/60;const con=Math.round((60-tre)*60);const dem=String(Math.floor(con/60)).padStart(2,'0')+':'+String(con%60).padStart(2,'0');
  const cd=(D.qc||[]).map(q=>({id:q.id,ma:q.ma,ten:q.tieude,nen:q.kenh==='Facebook Ads'||q.kenh==='Google Ads'||q.kenh==='Zalo Ads'?q.kenh:'Facebook Ads',ns:q.nganSach,tt:q.tt,luc:q.luc}));
  const giao=async(nd,kenh)=>{try{await op({op:'giaoViec',nd,kenh});setToast({m:'Đã giao việc – bot nhận trong vòng 1 giờ'});await nap()}catch(e){setToast({loi:1,m:e.message});throw e}};
  const dung=async()=>{if(chay&&!confirm('Dừng toàn bộ bot tự động (vòng lặp, nhận việc, đăng bài, soạn bài, bản tin)?'))return;const o={};MAY_TAT.forEach(k=>o[k]=!chay);try{await datCD(o);setToast({m:chay?'Đã dừng tất cả bot':'Đã bật lại bot tự động'});nap()}catch(e){setToast({loi:1,m:e.message})}};
  const S={D,nap,bai,viec,log,chay,dem,tre,cd,giao,setToast,doiTab};
  const soCho=bai.filter(b=>b.tt==='Chờ duyệt').length,choViec=viec.filter(v=>v.tt==='Chờ bot nhận'||v.tt==='Đang xử lý').length;

  return (<div className="min-h-screen lg:flex bg-[#070D18] overflow-x-hidden">
    {mo&&<div className="fixed inset-0 bg-black/60 z-30 lg:hidden" onClick={()=>setMo(false)}></div>}
    <aside className={`sb fixed lg:sticky top-0 left-0 z-40 h-screen w-72 shrink-0 overflow-y-auto border-r border-[#1E2B44] flex flex-col transition-transform ${mo?'translate-x-0':'-translate-x-full lg:translate-x-0'}`}>
      <div className="px-5 pt-5 pb-3 flex items-center gap-3"><span className="w-11 h-11 rounded-xl bg-gradient-to-br from-[#FFE38A] to-[#E9B83A] grid place-items-center text-[#0E1A2E] brand text-xl font-bold shadow-lg shadow-amber-900/30">O</span>
        <div><div className="brand text-[22px] leading-none tracking-[.12em] text-[#F2D27A]">ONI OFFICE</div><div className="text-[10.5px] tracking-[.28em] text-[#C9B27A] mt-1">BẢNG ĐIỀU KHIỂN</div></div></div>
      <nav className="px-3 pb-4 flex-1">{NHOM.map(([ten,ds])=>(<div key={ten} className="mt-3">
          <div className="px-3 py-1.5 text-[11px] font-bold tracking-[.22em] text-[#7F8DA8]">{ten}</div>
          <div className="space-y-0.5">{ds.map(([k,t,I])=>{const on=tab===k;const so=k==='duyet'?soCho:k==='boss'?choViec:0;
            return (<button key={k} onClick={()=>{doiTab(k);setMo(false)}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-[14.5px] transition border ${on?'bg-[#E9B83A]/10 border-[#E9B83A]/60 text-[#F6E3A6] font-semibold':'border-transparent text-[#C7CFDE] hover:bg-white/5'}`}>
              <I className={`w-[19px] h-[19px] shrink-0 ${on?'text-[#F2D27A]':'text-[#8E9AB3]'} ${k==='auto'&&chay?'animate-spin [animation-duration:4s]':''}`}/><span className="truncate text-left flex-1">{t}</span>
              {so>0&&<span className={`text-[11px] font-bold rounded-full min-w-[26px] px-2 py-0.5 ${k==='duyet'?'bg-gradient-to-r from-[#FFE38A] to-[#E9B83A] text-[#0E1A2E]':'bg-[#1E2E4D] text-[#C7CFDE]'}`}>{so}</span>}
            </button>)})}</div></div>))}</nav>
      <div className="px-5 py-3 border-t border-[#1E2B44] text-[11px] text-[#5B6884] space-y-1"><div>Số liệu thật · tự cập nhật 30 giây/lần</div><a href="/cu" className="underline">Mở bảng cũ</a> · <a href="/dang-xuat" className="underline">Đăng xuất</a></div>
    </aside>
    <main className="flex-1 min-w-0 p-4 md:p-6 space-y-5">
      <header className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3"><button onClick={()=>setMo(true)} className="lg:hidden p-2 rounded-lg border border-zinc-700" aria-label="Mở menu"><Menu className="w-5 h-5"/></button><div><div className="text-[11px] text-zinc-500 uppercase tracking-widest">AI Marketing Automation</div><h1 className="text-xl md:text-2xl font-extrabold text-white">{(MENU.find(m=>m[0]===tab)||MENU[0])[1]}</h1></div></div>
        <div className="flex flex-wrap items-center gap-2.5 w-full sm:w-auto">
          <label className="flex items-center gap-2 rounded-xl bg-zinc-900 border border-zinc-700 px-3 py-2 focus-within:border-amber-400 w-full sm:w-56"><Search className="w-4 h-4 text-zinc-500"/><input value={tim} onChange={e=>{setTim(e.target.value);const m=MENU.find(x=>x[1].toLowerCase().includes(e.target.value.toLowerCase()));if(e.target.value&&m)doiTab(m[0])}} placeholder="Tìm nhanh: Web, Zalo, duyệt…" className="bg-transparent outline-none text-sm w-full"/></label>
          <span className={`inline-flex items-center gap-2 px-3 py-2 rounded-full text-xs font-bold border ${chay?'bg-emerald-500/10 text-emerald-300 border-emerald-500/40':'bg-red-500/10 text-red-300 border-red-500/40'}`}><span className="relative flex h-2.5 w-2.5">{chay&&<span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>}<span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${chay?'bg-emerald-400':'bg-red-500'}`}></span></span>CONTENT LOOP: {chay?'ACTIVE':'STOPPED'}</span>
          <button onClick={dung} className={`inline-flex items-center gap-2.5 pl-3 pr-2 py-2 rounded-xl font-extrabold text-sm text-white transition ${chay?'bg-red-600 hover:bg-red-500':'bg-emerald-600 hover:bg-emerald-500'}`}><Power className="w-4 h-4"/>{chay?'DỪNG TẤT CẢ BOT':'BẬT LẠI BOT'}</button>
        </div>
      </header>
      {loiNap&&<div className="rounded-xl border border-red-500/40 bg-red-500/10 text-red-200 text-sm px-3 py-2">Lần tải số liệu gần nhất bị lỗi: {loiNap}. Đang hiện số của lần tải trước.</div>}
      <div key={tab}>
        {tab==='auto'&&<TabAuto S={S}/>}
        {tab==='boss'&&<TabBoss S={S}/>}
        {tab==='report'&&<TabBaoCao S={S}/>}
        {tab==='duyet'&&<TabDuyet S={S}/>}
        {tab==='lich'&&<TabLich S={S}/>}
        {tab==='doibot'&&<TabDoiBot S={S}/>}
        {tab.startsWith('k-')&&!NEN_ADS[tab.slice(2)]&&<TabKenh S={S} id={tab.slice(2)}/>}
        {NEN_ADS[tab.slice(2)]&&<TabAds key={tab} S={S} nen={NEN_ADS[tab.slice(2)]}/>}
      </div>
    </main>
    {toast&&(<div className="fixed bottom-5 right-5 left-5 sm:left-auto sm:w-[440px] z-50 in"><div className={`rounded-2xl p-4 shadow-2xl border flex gap-3 items-start backdrop-blur ${toast.loi?'bg-red-950/95 border-red-500/50':'bg-emerald-950/95 border-emerald-400/50'}`}>
      <span className={`w-9 h-9 rounded-full grid place-items-center shrink-0 ${toast.loi?'bg-red-500/20 text-red-300':'bg-emerald-500/20 text-emerald-300'}`}>{toast.loi?<X className="w-5 h-5"/>:<Check className="w-5 h-5"/>}</span>
      <div className="text-sm flex-1"><b className={toast.loi?'text-red-200':'text-emerald-200'}>{toast.loi?'Chưa làm được':'Xong'}</b><div className="text-zinc-200 mt-0.5">{toast.m}</div></div>
      <button onClick={()=>setToast(null)} className="text-zinc-400 hover:text-white"><X className="w-4 h-4"/></button></div></div>)}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
