<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Oni Office – Marketing</title>
<style>
:root{--cream:#FAF6EF;--white:#fff;--brown:#4A3220;--gold:#C9A04A;--tint:#F1E4C4;--line:#E2D6C2;--muted:#8A7562;--red:#B5523B;--redt:#F6DED6;--org:#C27A2C;--orgt:#F7E6D0;--yel:#9A7A12;--yelt:#FBF0C9;--grn:#5E7F4A;--grnt:#E2ECD9;--gry:#8A7562;--gryt:#EEE8DF;--blu:#3E6A93;--blut:#DCE7F1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=light]){color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif;background:var(--cream);color:var(--brown);display:flex;min-height:100vh}
aside{width:230px;background:#fff;border-right:1px solid var(--line);color:var(--brown);padding:20px 12px;flex:none}
aside h1{margin:0 8px;color:var(--gold);font-size:24px}aside p{margin:2px 8px 14px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line);padding-bottom:12px}
aside a{display:block;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}aside a.on{background:var(--tint);font-weight:600}aside a i{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:7px;margin-right:8px;font-style:normal;font-size:13px}
main{flex:1;min-width:0}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h2{margin:0;font-size:20px}.pill{background:var(--gold);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:6px 12px}
section{padding:20px 24px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.tile{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brown);border-radius:10px;padding:14px 16px}.tile small{color:var(--muted)}.tile b{display:block;font-size:26px;margin:4px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:640px}th{background:var(--tint);text-align:left;font-size:13px;padding:9px 12px}td{padding:9px 12px;border-top:1px solid #F0E8DB;font-size:14px}tr.c{cursor:pointer}tr.c:hover{background:#FCF8F0}
.g{padding:10px 14px;border-radius:10px;font-weight:600;margin:14px 0 8px;display:flex;justify-content:space-between}
.b{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.red{background:var(--redt);color:var(--red)}.org{background:var(--orgt);color:var(--org)}.yel{background:var(--yelt);color:var(--yel)}.grn{background:var(--grnt);color:var(--grn)}.gry{background:var(--gryt);color:var(--gry)}.blu{background:var(--blut);color:var(--blu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--brown)}
button{font:inherit;font-weight:600;background:var(--gold);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.note{background:#FFFDF8;border:1.5px solid var(--gold);border-radius:10px;padding:14px;margin-top:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:760px}.form label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:0 14px;padding:8px 16px;align-items:start}.dl>span{color:var(--muted);padding:7px 0;border-bottom:1px solid #0000000d}.dl>div,.dl>b{padding:7px 0;border-bottom:1px solid #0000000d;overflow-wrap:anywhere;min-width:0}.dl>div>.b,.dl>div>span.b{white-space:nowrap}

.lgM{display:none}
.lb{position:relative;background:#fff;border:0;border-radius:18px;padding:34px 40px;width:min(440px,100%);box-shadow:0 18px 50px rgba(90,60,20,.14),0 2px 8px rgba(90,60,20,.08)}
.lb h2{margin:0;font-size:28px;color:#3B2A18}.lb .lsub{color:var(--muted);font-size:14px;margin-top:2px}
.lb .lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 18px;flex-wrap:nowrap}
.lb .lrow label{margin:0;font-weight:400;font-size:14px;display:flex;align-items:center;gap:8px}.lb .lrow a{color:#9A7B2F;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer;text-decoration:none}
.lb .lbtn{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(180deg,#D2AE62,#B8924A);cursor:pointer;box-shadow:0 4px 12px rgba(176,138,69,.35)}
.pwi{position:relative}.pwi input{padding-right:42px!important;width:100%}.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;cursor:pointer;color:#8A7358;display:flex;align-items:center;justify-content:center;padding:0;border-radius:8px}.pweye:hover{background:rgba(0,0,0,.05)}
.capsw{display:inline-block;margin-top:8px;background:#FFF3DC;color:#A5671A;border-radius:8px;padding:5px 12px;font-size:13px}.capsw[hidden]{display:none}
@media(max-width:760px){.lg{flex-direction:column;background:#F8F4EC}.lgL{display:none}.lgM{display:flex;position:relative;flex:none;height:250px;background:linear-gradient(rgba(133,100,63,.9),rgba(133,100,63,.9)),var(--hall) center/cover no-repeat;border-radius:0 0 34px 34px;align-items:flex-start;justify-content:center;padding-top:26px;z-index:0}.lgM img{width:200px;height:auto;display:block}
.lgR{flex:none;display:block;padding:0 20px 40px;margin-top:-34px;overflow:visible}.lgR::before{top:60%;width:80%}.lb{margin:0 auto;padding:26px 22px}.lb h2{font-size:26px}.lb .lrow{font-size:13px}.lb .lrow label{font-size:13px}}
.lb label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}.lb input:not([type=checkbox]),.lb select{width:100%}.er{background:var(--redt);color:var(--red);border-radius:8px;padding:10px;margin-top:12px;font-size:13px;font-weight:600}.chip{border-radius:99px;padding:5px 12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:var(--brown)}.tk{background:#fff;border:1px solid var(--line);border-left:5px solid;border-radius:10px;padding:10px 12px;margin-bottom:8px}.tk small{color:var(--muted)}details{position:relative}summary{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;cursor:pointer;font-size:14px;color:var(--brown)}details label{flex-direction:row;color:var(--brown);font-size:13px;gap:6px;padding:2px 0}
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px;max-width:780px;position:relative;overflow:hidden;margin-top:12px}.doc h3{text-align:center;margin:14px 0}.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:800;color:rgba(181,82,59,.12);transform:rotate(-25deg);pointer-events:none}.sig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:26px;font-size:13px}.sig div{height:80px}.miss{background:var(--yelt);color:var(--yel);border-radius:6px;padding:2px 8px}
@media print{aside,header,.noprint{display:none!important}body{display:block}section{padding:0}.doc{border:0;margin:0}}
@media(max-width:760px){body{display:block}aside{width:100%;display:flex;overflow-x:auto;padding:8px;gap:4px}aside h1,aside p{display:none}aside a{white-space:nowrap}section,header{padding:14px}}
.md{position:fixed;inset:0;background:rgba(74,50,32,.45);z-index:80;overflow:auto;padding:24px 12px}.md[hidden]{display:none}.mb{background:#fff;border-radius:12px;margin:0 auto;padding:18px;border:1px solid var(--line)}.mb h3{margin:0 0 10px}.x{background:var(--gryt);color:var(--brown)}
textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:var(--brown)}

#lg .lb{border-radius:26px;padding:32px 28px;width:min(420px,100%);box-sizing:border-box;box-shadow:0 10px 36px rgba(111,79,49,.12),0 1px 4px rgba(111,79,49,.06)}
#lg .lb h2{font-size:26px;font-weight:700;color:#2E2117;letter-spacing:0}
#lg .lb .lsub{color:#7A6550;font-size:15px;margin:4px 0 6px}
#lg .lb label{font-size:15px;font-weight:600;color:#2E2117;margin:16px 0 6px}
#lg .lb input:not([type=checkbox]){height:52px;border-radius:14px;border:1px solid #E2D5C1;background:#FFFDF9;padding:0 16px;font-size:16px;color:#2E2117;box-sizing:border-box;font-family:inherit}
#lg .lb input:not([type=checkbox]):focus{outline:none;border-color:#896441;box-shadow:0 0 0 3px rgba(137,100,65,.15)}
#lg .owPw{position:relative}
#lg .owPw input{padding-right:52px!important}
#lg .owEye{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;background:none;color:#8A7764;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;padding:0}
#lg .owEye:hover{background:#F5EEE3}
#lg .lb .lrow{margin:16px 0 20px}
#lg .lb .lrow label{margin:0;font-size:14.5px;font-weight:400;color:#4A3726}
#lg .lb .lrow input[type=checkbox]{width:20px;height:20px;accent-color:#896441;margin:0}
#lg .lb .lrow a{color:#8A5E12;font-weight:600}
#lg .lb .lrow a:hover{color:#5C3F22}
#lg .lb .lbtn{height:54px;padding:0 16px;border-radius:16px;font-size:17px;background:linear-gradient(135deg,#9C7650,#7A5737);box-shadow:0 8px 18px rgba(122,87,55,.28);font-family:inherit}
#lg .lb .lbtn:hover{background:linear-gradient(135deg,#8C6844,#6A4B2E)}
#lg .lb .lbtn:disabled{opacity:.7;cursor:wait}
#lg button:focus-visible,#lg a:focus-visible{outline:2px solid #E9B83A;outline-offset:2px}
#lg .owFoot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#8A7764;margin-top:18px;padding-top:14px;border-top:1px solid #F2EBDF}
#lg .owGr{display:none}
@media(max-width:760px){
 #lg .lgM{height:auto!important;min-height:0;flex-direction:column;align-items:center!important;justify-content:flex-start!important;gap:10px;padding:26px 20px 58px!important;border-radius:0 0 28px 28px!important;background:linear-gradient(160deg,rgba(137,100,65,.88) 0%,rgba(111,79,49,.92) 60%,rgba(74,52,32,.95) 100%),var(--hall) center/cover no-repeat!important}
 #lg .lgM img{width:150px!important;height:106px!important;object-fit:cover;object-position:center top}
 #lg .owGr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#FFF3D6}
 #lg .owGr .r{display:flex;align-items:center;gap:10px}
 #lg .owGr .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,227,138,.14);border:1px solid rgba(255,227,138,.35);color:#FFE38A;display:flex;align-items:center;justify-content:center;flex:none}
 #lg .owGr .t{font-size:17px;font-weight:500}
 #lg .owGr .l{font-size:14px;color:#F3DDB0;line-height:1.5;max-width:300px}
 #lg .lgR{margin-top:-38px!important;padding:0 14px 28px!important}
 #lg .lgR::before{top:64%;width:86%}
 #lg .lb{padding:24px 18px!important;box-shadow:0 12px 32px rgba(111,79,49,.14)}
 #lg .lb h2{font-size:23px}
 #lg .lb input:not([type=checkbox]){height:50px}
 #lg .lb .lrow{flex-wrap:wrap;gap:8px 12px}
}

/* B3c 26/10: dòng MST không đè khung địa chỉ khi màn hình máy tính thấp */
.lgL .lgf{position:static!important;margin-top:26px!important;bottom:auto!important}
.lgL{overflow-y:auto}
@media (min-width:761px) and (max-height:780px){.lgL .lgo2{width:min(230px,52%)!important;margin-bottom:4px!important}.lgL .lgg{margin:8px 0 16px!important}.lgL .lga{padding:9px 14px!important}.lgL .lgf{margin-top:16px!important}}

/* B3d: câu chào lớn trên máy tính */
.lgL .lgt.owBig{display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px!important;font-weight:600!important;color:#FFF3D6;margin-top:18px!important}
.lgL .lgt.owBig .ic{width:50px;height:50px;border-radius:50%;background:rgba(255,227,138,.14);border:1px solid rgba(255,227,138,.4);color:#FFE38A;display:flex;align-items:center;justify-content:center;flex:none}
.lgL .lgg{font-size:18px!important;margin:10px 0 4px!important;color:#F3DDB0!important}
.lgL .owTip{font-size:14.5px;color:#EBCF94;margin:0 0 24px;text-shadow:0 1px 5px rgba(40,25,10,.45)}
@media (min-width:761px) and (max-height:780px){.lgL .lgt.owBig{font-size:25px!important;margin-top:10px!important}.lgL .lgt.owBig .ic{width:42px;height:42px}.lgL .owTip{margin-bottom:14px}}
/* B3d: logo nhỏ lại ~20% cho cân với câu chào */
@media (min-width:761px) and (min-height:781px){.lgL .lgo2{width:min(290px,64%)!important}}

.owS.cl>button.owSH svg{transform:rotate(-90deg)}
.owS.cl>.owSB{display:none}
.owSN{font-style:normal;display:inline-block;min-width:20px;height:20px;line-height:20px;margin-left:8px;padding:0 6px;border-radius:10px;background:#C0392B;color:#fff;font-size:11.5px;font-weight:700;text-align:center}
.owS:not(.cl) .owSN{display:none}
.owSB{display:flex;flex-direction:column;gap:2px;margin-left:16px;padding-left:6px;border-left:1px solid rgba(255,233,168,.22)}
body.ow #owNav a[data-p]{display:flex;align-items:center;gap:12px;min-height:42px;padding:8px 12px;border-radius:12px;color:#FFF6E6;font-size:14.5px;line-height:1.3;cursor:pointer;text-decoration:none;white-space:normal}
body.ow #owNav a[data-p]>i{display:none}
body.ow #owNav a[data-p]:hover{background:rgba(255,255,255,.08)}
body.ow #owNav a[data-p].on{background:#896441;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #FFE38A}
.owI{width:20px;height:20px;flex:none}
#owUser{margin-top:auto;padding:14px 12px 4px;border-top:1px solid rgba(255,226,150,.18);display:flex;flex-direction:column;gap:6px}
#owUser #usr{display:block;color:#FFF6E6;font-size:13.5px;margin:0 0 4px!important;padding:0 12px}
#owUser #usr b{color:#fff}
#owUser .bt{display:flex;gap:6px;padding:0 6px;flex-wrap:wrap}
#owUser button{flex:1 1 auto;background:rgba(255,255,255,.1)!important;color:#FFF6E6!important;border:1px solid rgba(255,226,150,.25)!important;border-radius:10px!important;padding:8px 10px!important;font-size:13px!important;font-weight:600;cursor:pointer}
#owUser button:hover{background:rgba(255,255,255,.18)!important}
/* thanh trên */
body.ow main{min-width:0;display:flex;flex-direction:column}
body.ow main>header{position:sticky;top:0;z-index:40;min-height:64px;padding:8px 20px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid #EEE5D6;display:flex;align-items:center;gap:10px;justify-content:flex-start;flex-wrap:nowrap}
body.ow main>header>h2#t{display:none!important}
body.ow main>header>span:not([id]){display:none!important}
body.ow main>header>div:not([id]){display:none!important}
#owT{flex:1 1 auto;min-width:0;font-size:19px;font-weight:700;color:#2E2117;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
#owLogoM{display:none}
.owTb{width:44px;height:44px;flex:none;border-radius:14px;border:0;background:none;color:#2E2117;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.owTb:hover{background:#F5EEE3}
.owTb svg{width:23px;height:23px}
#owPlus{background:#896441;color:#fff}
#owPlus:hover{background:#6F4F31}
#owBell .bd{position:absolute;top:4px;right:3px;background:#C2412D;color:#fff;border-radius:10px;font-size:11px;font-weight:700;min-width:18px;line-height:18px;text-align:center;border:2px solid #fff;padding:0 3px}
#owAv{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFE38A,#E9B83A);color:#5C3F22;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
#owPlusM{position:absolute;top:56px;right:64px;min-width:250px;background:#fff;border:1px solid #E7DCCB;border-radius:16px;box-shadow:0 14px 34px rgba(46,33,23,.16);padding:6px;z-index:70;display:none}
#owPlusM.op{display:block}
#owPlusM .h{font-size:12px;font-weight:600;letter-spacing:1px;color:#8A7764;padding:8px 12px 4px}
#owPlusM button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border:0;background:none;color:#2E2117;font-size:15px;font-weight:500;padding:8px 12px;border-radius:10px;cursor:pointer;text-align:left}
#owPlusM button:hover{background:#FBF6EE}
#owPlusM button svg{width:20px;height:20px;color:#896441;flex:none}
/* ô tìm nhanh – đầu mọi trang */
#owQ{padding:16px 24px 0;width:100%;max-width:1180px;box-sizing:border-box;position:relative;z-index:30}
#owQ>div{position:relative;max-width:none!important;margin:0!important;min-width:0!important;flex:none!important}
body.ow #gsQ{height:50px;border-radius:16px!important;border:1px solid #E7DCCB!important;background:#fff url("${SRCH}") no-repeat 16px center!important;padding:0 16px 0 46px!important;font-size:16px!important;color:#2E2117;box-shadow:0 2px 10px rgba(111,79,49,.05);-webkit-appearance:none;appearance:none}
body.ow #gsQ::placeholder{color:#9A8670}
body.ow #gsBox{border-radius:16px!important;border-color:#E7DCCB!important;box-shadow:0 12px 30px rgba(46,33,23,.15)!important;margin-top:6px!important}
body.ow section#v{padding:18px 24px 28px}
/* thẻ, bảng – tông nâu */
body.ow .card,body.ow .tile{border-color:#EEE5D6;border-radius:14px}
body.ow th{background:#F3E9D8;color:#4A3726}
#mnOv{background:rgba(43,29,20,.45)}
