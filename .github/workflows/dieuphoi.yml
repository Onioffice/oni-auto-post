name: Máy điều phối – nối trang Luồng tự động trong CRM (15 phút/lần)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency: { group: oni-dieuphoi, cancel-in-progress: true }
permissions: { contents: read, id-token: write, actions: write }
jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/dieuphoi.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
